version = "0.1.0"
description = ""
authors = ["abhijitreddy-06 <abhijitreddy828@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
langchain = "^1.2.0"
langchain-core = "^1.2.0"
langchain-classic = "^1.0.0"
openai = "^0.27.0"
langchain-google-genai = "^4.2.2"
